    <!-- Cabeçalho da Página (header) -->

    <!-- Seção Principal da Página (main) -->
    <main>

        <!-- Seção do Formulário -->
        <form action="#" method="submit" id="formulario">

            <label for="nome">Nome: </label>
            <input id="name" type="text" name="name" placeholder="Digite seu nome" />
            <span id="errNome"></span>

            <label for="email">Email: </label>
            <input id="email" type="text" name="email" placeholder="Digite seu email" />
            <span id="errEmail"></span>

            <label for="subject">Assunto: </label>
            <input id="subject" type="text" name="subject" placeholder="Digite o assunto da mensagem" />
            <span id="errSubject"></span>

            <label for="message">Mensagem: </label>
            <textarea id="message" name="message" placeholder="Digite sua mensagem"></textarea>

            <button type="submit">Enviar</button>

        </form>

        <!-- Seção do Google Maps -->

            <address>
              
                <p>Limeira- SP</p>
            </address>

           <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d235755.13114640652!2d-47.52657212457627!3d-22.591295821390535!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94c880ecaee30113%3A0xd333475dd751788f!2sLimeira%20-%20SP!5e0!3m2!1spt-BR!2sbr!4v1762292110892!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
